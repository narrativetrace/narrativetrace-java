# Tier 1 allocation invariants — the one place the numbers live.
#
# `allocationCheck` runs these benchmarks with `-prof gc` and fails when any of
# them allocates more B/op than its line here allows. Nothing else reads this
# file; `allocation-baseline.txt` explains what each number means and where it
# came from, and must be updated in the same change as any edit here.
#
# Measured 2026-08-31 (evening, after the R2 fix) and re-measured 2026-09-01
# (after the agent's call-site gate and per-method constants), JDK 17.0.20,
# 3 warmup + 5 measurement x 1s, -Xms256m -Xmx256m. Every reading was stable to
# +/-0.001 B/op within a run, and all five rows read the same figure in both of
# the 2026-09-01 runs.
#
# THE BAND IS 8 BYTES, and that is arithmetic rather than a round number:
# allocation on these paths is deterministic to +/-0.001 B/op, and the smallest
# thing a regression can add is one object — 16 bytes of header before a single
# field. A band of 8 is therefore wider than any noise that exists here and
# narrower than anything real. The previous bands were ~5% of figures that were
# themselves ~90% benchmark fixture.
#
# WHY THESE NUMBERS DROPPED BY AN ORDER OF MAGNITUDE. Until 2026-08-31 these
# rows were dominated by the benchmarks' own `@Setup(Level.Invocation)` fixture:
# `context.reset()` materialised a whole `TraceStack` on a thread that had never
# traced (~336 B per call, two to five calls per benchmark). `reset()` now does
# nothing when the calling thread holds no stack, so these rows measure the
# library again:
#
#   context_enterExit_NOOP  1680 -> 0     the no-op context allocates nothing
#   directCall               728 -> 56    exactly February's figure
#   proxy_noopContext        752 -> 80    24 B over directCall: the args array
#   proxy_OFF                752 -> 80    24 B over directCall: the args array
#   agent_OFF                728 -> 392   NOT fixture — see allocation-baseline.txt
#
# AND WHY agent_OFF THEN DROPPED AGAIN, 400 -> 64, on 2026-09-01. The 392 was
# the injected call site marshalling before it asked: three arrays and a whole
# `MethodSignature` built on every invocation, for a context that answered "off".
# `AgentRuntime.isActive()` is now the first instruction of every instrumented
# method and every injected call sits behind it, so the row reads 56 B/op —
# `directCall` exactly. 56 measured + this file's 8-byte band = 64, which is
# `directCall`'s own threshold, and that is the right shape: an inactive
# instrumented method allocates what an uninstrumented one does, so it is gated
# the same way.
#
#   agent_OFF                392 -> 56    the gate comes before the marshalling
#
#                                                            measured -> max
ai.narrativetrace.benchmarks.ContextOverheadBenchmark.context_enterExit_NOOP=8
ai.narrativetrace.benchmarks.ProxyOverheadBenchmark.directCall=64
ai.narrativetrace.benchmarks.ProxyOverheadBenchmark.proxy_noopContext=88
ai.narrativetrace.benchmarks.ProxyOverheadBenchmark.proxy_OFF=88
ai.narrativetrace.benchmarks.AgentOverheadBenchmark.agent_OFF=64
