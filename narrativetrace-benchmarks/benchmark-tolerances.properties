# Tolerance bands for `benchmarkCompare` — the one place the bands live.
#
# `benchmarkCompare` reads a JMH JSON result, matches each benchmark against
# `baseline.txt`, and fails when the reading is worse than the baseline by more
# than the band below. Being FASTER never fails: an improvement is not a
# regression, and a build that punished one would teach people to skip the gate.
#
# Keys are matched longest-prefix-first against the short `Class.method` name,
# so `default` is the fallback and anything more specific overrides it. Values
# are percentages.
#
# Why 25 % for throughput, re-justified 2026-08-31 (evening). The old reason was
# the `@Setup(Level.Invocation)` fixture, which JMH can only subtract by
# timestamping every invocation and which it documents as usable above ~1 ms/op;
# these benchmarks run at 2–30,000 ns. That fixture is gone from
# `ProxyOverheadBenchmark` and `ContextOverheadBenchmark`, and the fast rows'
# error bars collapsed with it (proxy_noopContext 20.308 ± 0.810 = ±4 %,
# context_enterExit_DETAIL 1289.8 ± 79.3 = ±6 %).
#
# The band still cannot be tightened, because the remaining noise is the
# *container*, not the harness: in the same re-baseline run `proxy_OFF` read
# 26.508 ± 24.661 (±93 %) and `proxy_narrated_static` 1712 ± 1378 (±80 %), and
# one probe caught a 7,260 ns reading on a benchmark whose quiet value is 25 ns.
# Load average reached 20 on eight shared cores during the session. A band
# tighter than that is a flaky build, and a flaky gate is worse than a loose one
# because it teaches people to re-run it.
#
# The tight, meaningful gate on this suite remains the allocation one — see
# `allocation-thresholds.properties`, now banded at 8 BYTES on the fast paths.
default = 25

# Allocation is the tight band, and it stays at 5 %. It was briefly set to 3 %
# during the 2026-08-31 fix run and put back when the measurement said no: the
# unbatched rows mostly reproduce to the byte, but the proxy rows now batch 1,000
# calls per invocation, and inside a hot loop the JIT sometimes scalar-replaces
# allocations that survive an isolated call. Across four runs of the same jar
# `proxy_notTraced` read 1046 / 974 / 958 / 950 B/op — a 10 % spread that a 3 %
# band would fail on. `allocation-baseline.txt` records the maximum of those
# runs, so the band is measured against a ceiling rather than a lucky reading.
#
# WHAT READS THIS KEY, TODAY: nothing in `benchmarkCompare`. The task compares
# the TIME metric only — `BenchmarkCompareSupport.compare` builds one comparison
# per baseline row and passes `allocation = false` — so `allocation.default` is
# parsed, unit-tested through `toleranceFor`, and never applied to a run. The
# allocation gate that does fire is `allocationCheck`, on the five fast-path
# benchmarks, against the absolute byte thresholds in
# `allocation-thresholds.properties`; every other allocation figure is recorded
# rather than gated, exactly as `allocation-baseline.txt` says. Wiring the
# allocation half of the comparison is open work under TODO 20; the band is left
# here, at the value it should have when that lands, rather than deleted.
allocation.default = 5

# The buffer contention benchmarks measure a shared cache line under
# oversubscription; on a container whose core count is not the runner's, they
# move more than the rest.
PipelineOverheadBenchmark.bufferOffer_4threads = 60
PipelineOverheadBenchmark.bufferOffer_16threads = 60

# Sub-10 ns benchmarks: a 2 ns absolute move is 25 % and means nothing.
PipelineOverheadBenchmark.publish_noConsumers = 100
PipelineOverheadBenchmark.publish_narrationOnly = 100
PipelineOverheadBenchmark.publish_capturing = 60
PipelineOverheadBenchmark.publish_narratingAndCapturing = 60
PipelineOverheadBenchmark.bufferOffer_1thread = 100
PipelineOverheadBenchmark.bufferOffer_shedding = 100

# `context_enterExit_NOOP` and `directCall` fell into single digits on
# 2026-08-31 when the per-invocation fixture left, and the fix run proposed
# moving them into the category above (100 % and 60 %). They are deliberately
# NOT there: no band in this file is widened for a row that got faster, and the
# arithmetic says they do not need it. The baseline records the WORST of the
# three re-baseline runs, so the band is measured from a ceiling:
#
#   context_enterExit_NOOP  baseline 3.212 ns → 25 % allows 4.015 ns
#                           four full-suite runs read 2.384 / 2.5 / 2.8 / 3.212
#   directCall              baseline 11.567 ns → 25 % allows 14.459 ns
#                           four full-suite runs read 6.810 / 8.876 / 9.7 / 11.567
#
# Every reading either row has produced is inside the default band, with 25 %
# and 30 % of headroom over the slowest one. The honest risk, recorded rather
# than pre-empted by a wider percentage: a *percentage* band is the wrong shape
# for a 2 ns benchmark, and on a container that once read 7,260 ns where the
# quiet value is 25 ns, any band can be broken by the machine. The fix is an
# absolute floor in `benchmarkCompare` — "a move under N ns is not a regression"
# — not a bigger percentage. Open work under TODO 20.
