# Machine-readable claims this repository's documentation makes about defaults, entry points,
# config shapes and their effects — checked against a PUBLISHED (never local) install, never a
# workspace build. See documentation/contract-gate.md for what runs this and when.
#
# Schema (four `kind`s, docs-vs-published-gate §2):
#   id                  unique slug
#   kind                entry-point | reflectable-default | probed-default | config-shape
#   page                "<doc path>#<anchor>" — the sentence this entry backs
#   claim               one human sentence
#   since               the version the claim first holds (x.y.z)
#   documented_default  (reflectable-default, probed-default) the exact observed value expected
#   expected_effect     (config-shape) same role, named the way the design note spells it
#   probe               source file (repo-relative) implementing the check
#   coordinate          (entry-point only) "<group>:<artifact>"
#   registry            (entry-point only) maven-central (default) | gradle-plugin-portal
#
# `since` exempts an entry from the nightly gate only while it is LATER than the version actually
# installed that run (docs-vs-published-gate §5.1 ruling 1) — never keyed on this repo's own
# gradle.properties version. contractLint (per commit, no network) validates this file's shape;
# contractCheck (nightly, registry-backed) runs contract-probe/ against it.
version_source: "gradle.properties#narrativetraceVersion"
entries:
  # ---- entry points: does the coordinate resolve at all, on the real registry -----------------
  - id: entry-point-core
    kind: entry-point
    registry: maven-central
    coordinate: "ai.narrativetrace:narrativetrace-core"
    page: "documentation/installation-guide.md#2-add-dependencies"
    claim: "ai.narrativetrace:narrativetrace-core resolves on Maven Central at the installed version"
    since: "0.1.0"
    documented_default: "PRESENT"
    probe: "contract-probe/src/main/java/ai/narrativetrace/contract/probes/EntryPointProbe.java"

  - id: entry-point-proxy
