# Trigger cases (skill-harness-design.md §4.3): must fire on the positive phrasings, must stay
# quiet on the negative ones. Gates on rate, target >=90% (harness §5). Phrasings mined (never
# invented) from documentation/troubleshooting.md's own question-shaped headings — "Parameters show
# as arg0, arg1", "No trace output files", "Approval mode wrote .received.nt" — plus the doctor
# skill's own description/when_to_use text and the doctor genre's own conventions (npm doctor,
# expo doctor, flutter doctor).

positive:
  - "parameters show as arg0, arg1"
  - "no trace output files"
  - "why isn't anything being traced"
  - "check my narrativetrace setup"
  - "is narrativetrace broken"
  - "is my narrativetrace install okay"
  - "narrativetrace doctor"
  - "run a pre-flight check on narrativetrace before I wire it into this service"
  - "approval mode wrote a stale .received.nt file"
  - "narrativetrace-junit5 never seems to run"

# Adjacent-but-wrong asks: another skill's job, a different troubleshooting.md entry entirely
# (Spring beans, Micronaut filters, clarity scoring, the agent), or no skill's job at all. Must
# NOT fire.
negative:
  - "add narrative tracing to my service"
  - "install narrativetrace"
  - "wrap this class so I can see a trace"
  - "send my traces to my logger"
  - "spring beans not being traced"
  - "micronaut http filter injects no user context"
  - "clarity score seems wrong"
  - "agent doesn't instrument classes"
  - "what does narrativetraceproxy.trace do"
  - "upgrade narrativetrace to the latest version"
