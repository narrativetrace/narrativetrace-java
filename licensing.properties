# Licensing category, one line per Gradle subproject. Read by the build
# (`licensingCheck`, wired into `check`), by the per-module POM `<licenses>`
# block, and by the header stamp in `scripts/publish-public.sh`. It is the
# single source for all three, so a module can never be published under a
# licence its build did not agree to.
#
#   open — Apache License 2.0. The contract: what third-party code compiles
#          against. Open because a standard nobody can read is not a standard.
#          An `open` module may depend on nothing.
#   free — Business Source License 1.1, converting to Apache 2.0 four years
#          after each release. The runtime and every integration: free to use
#          in production, source-available, auditable. A `free` module may
#          depend on `open` and `free` modules only.
#
# Every subproject must have a line, including the ones that are never
# published: they still ship in the source-available tree.

