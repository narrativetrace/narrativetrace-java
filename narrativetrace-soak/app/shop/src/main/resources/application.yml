server:
  port: 8080

spring:
  application:
    name: narrativetrace-soak-shop
  datasource:
    url: jdbc:h2:mem:soak;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always

soak:
  notify:
    url: http://localhost:8081
  poison:
    field: quantity
    value: 2000000000

management:
  endpoints:
    enabled-by-default: false
