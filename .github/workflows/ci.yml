# Public CI — part of the released source (a product artifact); the
# repository has no other CI.
#
# Third-party actions are pinned to full commit SHAs, with the human-readable
# tag in a trailing comment. A tag such as `@v4` is mutable: the upstream owner
# can move it, and an account compromise moves it for everyone at once. A SHA
# cannot be moved, so an upstream compromise cannot reach this repository
# without a commit here that a reviewer can see. Renovate/Dependabot understand
# the `# v4` comment and will propose SHA bumps against it.
name: CI

# Least privilege by default: no job gets a token permission it has not asked
# for by name. Pinned actions bound *what code* runs; this bounds what that code
# can do with the repository if one of them is ever compromised. Both jobs only
# read the checkout, so neither overrides this.
permissions: {}

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly JDK-21 run: the toolchain is pinned to 17 for reproducibility, so
    # JDK-21-gated test bodies (virtual threads) skip everywhere else. This job
    # is where they deliberately execute, and where the coverage-guided fuzz tier
    # and the concurrency stress suite run. `check` replays the committed fuzz
    # seed corpus on every commit (seconds); this is the same targets under a
    # time budget, plus jcstress over the event pipeline.
    - cron: "17 4 * * 1"

jobs:
  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - run: ./gradlew check

  jdk21:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - run: ./gradlew check -Pnarrativetrace.toolchain=21
      - run: ./gradlew fuzz -Pnarrativetrace.toolchain=21
      # Concurrency stress over the event pipeline, in `quick` mode: about
      # twenty minutes, every scenario, every JVM configuration jcstress
      # derives. A forbidden interleaving fails the job; the unbounded default
      # mode is a manual run.
      - run: ./gradlew :narrativetrace-jcstress:jcstress -PjcstressMode=quick -Pnarrativetrace.toolchain=21
      # A crash is only reproducible with the input that caused it, and Jazzer
      # writes that into the working directory — so the artifacts matter most
      # exactly when the job failed.
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: fuzz-results
          path: |
            narrativetrace-security-tests/build/fuzz/
            narrativetrace-security-tests/build/reports/tests/
          retention-days: 30
      # Same reasoning for the stress report: a forbidden outcome is only
      # diagnosable from the run that observed it.
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: jcstress-results
          path: narrativetrace-jcstress/build/reports/jcstress/
          retention-days: 30
