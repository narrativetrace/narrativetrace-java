# Proves the Gradle Plugin Portal credentials and the plugin's metadata WITHOUT publishing:
# `publishPlugins --validate-only` authenticates against the Portal and validates the plugin
# as it would be published, then stops. Run it by hand from the Actions tab; it uses the same
# `release` environment as a real release, so it needs the same approval.
name: Plugin Portal check

permissions: {}

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Validate the plugin against the Portal (no publish)
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: |
          set -euo pipefail
          [ -n "${GRADLE_PUBLISH_KEY}" ] || { echo "GRADLE_PUBLISH_KEY is empty in the release environment"; exit 1; }
          [ -n "${GRADLE_PUBLISH_SECRET}" ] || { echo "GRADLE_PUBLISH_SECRET is empty in the release environment"; exit 1; }
          ./gradlew :narrativetrace-gradle-plugin:publishPlugins --validate-only --no-daemon
          echo "Portal validation passed: credentials accepted, metadata valid, nothing published."
