# Nightly consumer-truth canary — part of the released source (a product
# artifact), like ci.yml, whose action-pinning and least-privilege rules this
# file follows: third-party actions pinned to full commit SHAs, no job granted
# a token permission it has not asked for by name.
#
# What it proves, every night, from a cold environment: the latest released
# version still resolves from the REAL Maven Central and Gradle Plugin Portal
# (no mavenLocal, isolated Gradle user home), and the exact one-service-one-
# test recipe documentation/sixty-seconds.md teaches still builds and
# writes its trace file. In other words: a first-time adopter's day one still
# works. scripts/verify-publication.sh holds all the logic; this file only
# schedules it (the same thin-CI rule ci.yml cites).
#
# Nightly rather than release-chained on purpose: Central's sync is documented
# as "minutes to hours", so a run fired the moment artifacts are submitted
# spends its life polling. A nightly run is at most one night behind a release
# and needs only a modest timeout — if Central is mid-sync tonight, tomorrow's
# run catches it. This is a canary, not a gate: a red run means "investigate"
# (usually Central or Portal weather), never "the build is broken", and no
# other job waits on it.
name: Verify publication

permissions: {}

on:
  schedule:
    - cron: "42 3 * * *"
  # Manual runs for the publish checklist: after a release, trigger this with
  # the new version instead of running the script from a laptop.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to verify (default: the last published version — see scripts/verify-publication.sh)"
        required: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # scripts/verify-publication.sh resolves the version to verify from the newest v* tag
          # reachable from HEAD when the schedule omits one, and tags need history to be found.
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17
      - name: Verify the last published release resolves and the recipe traces
        # The dispatch input reaches the shell through the environment, never by template
        # interpolation into the script body — the same reasoning as the SHA-pinning above: no
        # path where outside text becomes code. When empty (the schedule's own case),
        # scripts/verify-publication.sh resolves the version itself — the newest v* tag reachable
        # from HEAD, else Maven Central's maven-metadata.xml <latest> — and prints which source
        # decided. It never falls back to this checkout's own gradle.properties version: that
        # moves on to the next -SNAPSHOT the instant a release is cut, so a scheduled run reading
        # it would poll for artifacts that were never going to exist.
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            bash scripts/verify-publication.sh "$INPUT_VERSION" --timeout=1800
          else
            bash scripts/verify-publication.sh --timeout=1800
          fi
