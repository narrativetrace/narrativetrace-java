# Trigger cases (skill-harness-design.md §4.3): must fire on the positive phrasings, must stay
# quiet on the negative ones. Gates on rate, target >=90% (harness §5). Phrasings mined (never
# invented) from the add-narrative-tracing skill's own description text and
# documentation/installation-guide.md's own framing of a not-yet-installed project.

positive:
  - "add narrative tracing to my service"
  - "install narrativetrace"
  - "get a trace in sixty seconds"
  - "wrap this class so I can see a trace"
  - "send my traces to my logger"
  - "set up narrativetrace in this project"
  - "how do I get started with narrativetrace"
  - "this project has no narrativetrace yet, help me add it"
  - "hook narrativetrace up to logback"
  - "trace this service and show me the output"
  # The published init prompt itself (README "Start here", documentation/llms.txt). A prompt we
  # publish is a prompt we replay: if the skill does not fire on the text we tell people to paste,
  # the ladder's first rung hands the agent to nobody. Kept byte-identical to the published copies
  # by InitPromptDriftTest.
  - |
      Set up NarrativeTrace in this project and show me its first trace.

      1. Read https://narrativetrace.ai/java/llms.txt first. It carries the
         install block and the known traps. Do not guess versions or artifact
         names.
      2. If this directory has no project yet, create the smallest console app
         that llms.txt's "Install and first trace" block describes. Otherwise
         work inside the existing project and trace one real service boundary.
      3. Add the plugin the way llms.txt shows, then run
         `./gradlew narrativetraceInit --diff` and show me the diff. It installs
         the NarrativeTrace agent skills into this project and adds a marked
         section to AGENTS.md. Run it for real only after I have seen the diff.
      4. If the `add-narrative-tracing` skill is now available, follow it.
         Otherwise follow the "Install and first trace (copy this)" block in
         llms.txt.
      5. Add one test that traces a call with a deny-listed parameter and
         asserts the trace shows `[REDACTED]` for it.
      6. Run the program, then run the doctor (`./gradlew narrativetraceDoctor`).
         Paste the trace and the doctor report, explain the trace in two
         sentences, and list exactly what changed in the project.

      Rules: never disable redaction; do not commit `.received.nt` files; keep
      the `-parameters` compiler flag; run everything in the foreground and
      read the output before you report; if you cannot fetch URLs, say so and I
      will paste llms.txt.
# The doctor's own positive set (diagnosing an existing install is that skill's job, not this
# one's), plus another skill's job or no skill's job at all. Must NOT fire.
negative:
  - "check my narrativetrace setup"
  - "is narrativetrace broken"
  - "why isn't anything being traced"
  - "parameters show as arg0, arg1"
  - "no trace output files"
  - "narrativetrace doctor"
  - "approval mode wrote a stale .received.nt file"
  - "make my tests produce narrative traces"
  - "generate a sequence diagram for this PR"
  - "upgrade narrativetrace to the latest version"
